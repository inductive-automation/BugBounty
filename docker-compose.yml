##################################################################
# Chase Dorsey, Inductive Automation    Aug. 28, 2026
#
# # YAML includes two Ignition servers and Postgres
##################################################################
x-ignition-opts: &ignition-opts
  image: inductiveautomation/ignition:8.3.10

services:
  # Ignition Gateway
  backend-gw1:
    <<: [ *ignition-opts ]
    hostname: backend-gw1
    restart: always
    ports:
      - 18088:8088
      - 18043:8043
    volumes:
      # Gateway backup
      - ./gw-init/backend.gwbk:/restore.gwbk
      
      # Ignition Data
      - ignBackendData:/usr/local/bin/ignition/data

    environment:
      ACCEPT_IGNITION_EULA: 'Y'
      IGNITION_EDITION: standard
      GATEWAY_NETWORK_REQUIRETWOWAYAUTH: "true"
      GATEWAY_NETWORK_SECURITYPOLICY: "Unrestricted"
      TZ: America/Los_Angeles
    command:
      -n bb_ign_backend
      --restore-local /restore.gwbk

  frontend-gw1:
    <<: [ *ignition-opts ]
    user: 0:0
    hostname: frontend-gw1
    restart: always
    ports:
      - 28088:8088
      - 28043:8043
    volumes:
      # Gateway backup
      - ./gw-init/frontend.gwbk:/restore.gwbk
      
      # Ignition Data
      - ignFrontendData:/usr/local/bin/ignition/data
      
      # Ignition Project
      - ./gw-projects/frontendproject:/usr/local/bin/ignition/data/projects/frontendproject

    environment:
      ACCEPT_IGNITION_EULA: 'Y'
      IGNITION_EDITION: standard
      GATEWAY_NETWORK_REQUIRETWOWAYAUTH: "true"
      GATEWAY_NETWORK_0_HOST: backend-gw1
      TZ: America/Los_Angeles
      IGNITION_UID: 2003
      IGNITION_GID: 2003
    command:
      -n bb_ign_frontend
      --restore-local /restore.gwbk
      
  # Postgres Database
  postgres:
    image: postgres:16.3
    hostname: PostgreSQL
    restart: always
    environment:
      POSTGRES_PASSWORD: PostgreSQL
      POSTGRES_USER: Postgres
      POSTGRES_DB: Postgres
      TZ: America/Los_Angeles
    ports:
     - 15432:5432
    volumes:
      - pgData:/var/lib/postgresql/data
    
volumes:
  ignBackendData:
  ignFrontendData:
  pgData:
